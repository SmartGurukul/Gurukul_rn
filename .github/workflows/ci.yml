name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The web app at smartgurukul.org/app is this same code built for the browser. Building it here
      # catches a change that breaks the web bundle (e.g. a new native-only module with no web
      # stand-in in metro.config.js). It does not publish anything: docs/app is updated by running
      # `npm run build:web` and committing the result.
      - name: Web build
        run: npx expo export --platform web --output-dir dist/web
